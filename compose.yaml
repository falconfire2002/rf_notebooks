version: '3.8'

services:
  sdr-lab:
    image: localhost/sdr-lab:latest   # <--- Explicit local image tag avoids short-name lookup errors
    build:
      context: .
      dockerfile: Containerfile
      args:
        - GNURADIO_VERSION=v3.10.12.0
    container_name: Rf_lab
    environment:
      - COMPOSE_PROJECT_NAME=Rf_lab
    ports:
      - "8888:8888"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    network_mode: host
    volumes:
      - ./workspace:/workspace
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--allow-root", "--no-browser", "--ServerApp.token='pluto'"]